# Kestrel26-nano: architecture config for `kestrel("kestrel26n.yaml")`
# The trailing 'n' selects the nano width-scale (see kestrel/nn.py SCALES).
#
# imgsz/nc/names here are just fallback defaults for building/predicting
# before training -- calling model.train(data=...) auto-detects the real
# image size and class list from the dataset (like YOLO) and rebuilds the
# heads to match if they differ from what's below.
cls:                  # classifier head -- runs FIRST, on the full frame
  filters: 16
  dense: 16

bbox:                 # bbox head -- runs SECOND, conditioned on the predicted class
  filters: 16
  dense: 32
  class_embed: 4
