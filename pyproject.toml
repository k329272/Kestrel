[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel"
version = "0.1.0"
description = "A YOLO-style API around a two-head TensorFlow rock-paper-scissors detector"
requires-python = ">=3.9"
dependencies = [
    "tensorflow>=2.12",
    "opencv-python-headless",
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
onnx = ["tf2onnx"]

[tool.setuptools]
packages = ["kestrel"]

[tool.setuptools.package-data]
kestrel = ["cfg/*.yaml"]
