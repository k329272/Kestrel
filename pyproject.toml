[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel"
version = "0.2.0"
description = "A small PyTorch rock-paper-scissors detector with a YOLO-style API"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "opencv-python-headless",
    "numpy",
    "pyyaml",
]

[tool.setuptools]
packages = ["kestrel"]

[tool.setuptools.package-data]
kestrel = ["cfg/*.yaml"]
